<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Control de flota{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #12222f;
            --muted: #526371;
            --paper: #f5f7f2;
            --card: #ffffff;
            --accent: #1b6b5c;
            --accent-soft: #dceee8;
            --line: #dce3de;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--ink);
            background: radial-gradient(circle at top right, #dceee8 0, transparent 35%), var(--paper);
        }
        .shell { width: min(1040px, calc(100% - 32px)); margin: 0 auto; }
        header { padding: 28px 0; }
        .brand { color: var(--ink); font-weight: 800; text-decoration: none; letter-spacing: -0.02em; }
        main { padding: 56px 0 80px; }
        .eyebrow { margin: 0 0 12px; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: .12em; font-size: .78rem; }
        h1 { margin: 0; max-width: 800px; font-size: clamp(2.4rem, 7vw, 5.4rem); line-height: .98; letter-spacing: -.055em; }
        .lead { max-width: 720px; margin: 28px 0 0; color: var(--muted); font-size: 1.15rem; line-height: 1.7; }
        .status { display: inline-flex; margin-top: 26px; padding: 10px 14px; border-radius: 999px; color: #115044; background: var(--accent-soft); font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 52px; }
        .card { padding: 22px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 35px rgba(33, 54, 47, .06); }
        .card span { display: block; color: var(--accent); font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
        .card strong { display: block; margin-top: 8px; font-size: 1.12rem; }
        .error-code { margin: 0; color: var(--accent); font-size: clamp(5rem, 20vw, 11rem); font-weight: 900; line-height: .8; letter-spacing: -.08em; }
        .button { display: inline-block; margin-top: 28px; padding: 13px 18px; border-radius: 12px; background: var(--accent); color: white; font-weight: 800; text-decoration: none; }
        footer { padding: 24px 0 34px; color: var(--muted); border-top: 1px solid var(--line); font-size: .9rem; }
    </style>
</head>
<body>
    <header class="shell">
        <a class="brand" href="{% url 'flota:inicio' %}">Flota · Backend Django</a>
    </header>
    <main class="shell">
        {% block content %}{% endblock %}
    </main>
    <footer class="shell">Proyecto académico de Esteban Llanos · INACAP 2026</footer>
</body>
</html>
